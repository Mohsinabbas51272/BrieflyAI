<!DOCTYPE html>
<html lang="en" class="light">
<head>
  <meta charset="UTF-8">
  <title>BrieflyAI Popup</title>
  <style>
    /* Runs before CSS loads — kills Chrome's default white window instantly */
    html, body {
      margin: 0 !important;
      padding: 0 !important;
      background: #e8ecf5 !important;
    }
    html.dark, body.dark {
      background: #07101f !important;
    }
  </style>
  <link rel="stylesheet" href="popup.css">
</head>
<body class="light">
  <div class="app-card">
    <!-- Top Header -->
    <header class="header">
      <div class="brand">
        <div class="logo-box">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 2L14.4 9.6L22 12L14.4 14.4L12 22L9.6 14.4L2 12L9.6 9.6L12 2Z" fill="white" />
            <circle cx="19" cy="5" r="2" fill="white" fill-opacity="0.9" />
          </svg>
        </div>
        <div class="brand-text">
          <span class="brand-name">Briefly<span class="ai-text">AI</span></span>
          <span class="hub-pill">HUB</span>
        </div>
      </div>

      <div class="header-right">
        <!-- Connected Status Pill -->
        <div class="status-pill" id="status-pill">
          <span class="status-dot"></span>
          <span class="status-text" id="status-text">Connected</span>
        </div>

        <!-- User Profile & Theme Toggle Segmented Pill -->
        <div class="profile-theme-pill">
          <div class="user-action" id="user-btn" title="BrieflyAI Account">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
          </div>
          <div class="divider"></div>
          <button class="theme-toggle-btn" id="theme-toggle-btn" title="Toggle Light / Dark Mode">
            <svg id="moon-icon" width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
            <svg id="sun-icon" class="hidden" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="5"></circle>
              <line x1="12" y1="1" x2="12" y2="3"></line>
              <line x1="12" y1="21" x2="12" y2="23"></line>
              <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
              <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
              <line x1="1" y1="12" x2="3" y2="12"></line>
              <line x1="21" y1="12" x2="23" y2="12"></line>
              <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
              <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
            </svg>
          </button>
        </div>
      </div>
    </header>

    <!-- Main Content Area -->
    <main class="content">
      <!-- Active Tab Detection Card -->
      <div class="tab-card" id="tab-info-card">
        <div class="tab-badge" id="tab-badge">
          <span class="badge-icon" id="badge-icon">📄</span>
          <span class="badge-label" id="badge-label">Website Article Detected</span>
        </div>

        <h2 class="tab-title" id="tab-title">Loading active page...</h2>

        <div class="tab-url-row">
          <span class="tab-url" id="tab-url">https://...</span>
          <svg class="external-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
            <polyline points="15 3 21 3 21 9"></polyline>
            <line x1="10" y1="14" x2="21" y2="3"></line>
          </svg>
        </div>
      </div>

      <!-- Controls Row: AI Model & Tone -->
      <div class="controls-grid">
        <div class="control-field">
          <label class="control-label">AI MODEL</label>
          <div class="select-wrapper">
            <span class="select-icon" id="model-icon">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none">
                <path d="M12 2L14.4 9.6L22 12L14.4 14.4L12 22L9.6 14.4L2 12L9.6 9.6L12 2Z" fill="url(#geminiGrad)" />
                <defs>
                  <linearGradient id="geminiGrad" x1="2" y1="2" x2="22" y2="22" gradientUnits="userSpaceOnUse">
                    <stop stop-color="#4285F4" />
                    <stop offset="0.5" stop-color="#9B72CB" />
                    <stop offset="1" stop-color="#D96570" />
                  </linearGradient>
                </defs>
              </svg>
            </span>
            <select id="model-select" class="styled-select">
              <option value="gemini-1.5-flash">Gemini 1.5 Flash (Fast)</option>
              <option value="gemini-1.5-pro">Gemini 1.5 Pro (Deep)</option>
              <option value="gpt-4o-mini">GPT-4o Mini (OpenAI)</option>
              <option value="smart-engine">Briefly Smart NLP Engine</option>
            </select>
            <span class="chevron-icon">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="6 9 12 15 18 9"></polyline>
              </svg>
            </span>
          </div>
        </div>

        <div class="control-field">
          <label class="control-label">TONE</label>
          <div class="select-wrapper">
            <span class="select-icon" id="tone-icon">💼</span>
            <select id="tone-select" class="styled-select">
              <option value="executive">Executive</option>
              <option value="technical">Technical</option>
              <option value="casual">Casual</option>
              <option value="academic">Academic</option>
            </select>
            <span class="chevron-icon">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="6 9 12 15 18 9"></polyline>
              </svg>
            </span>
          </div>
        </div>
      </div>

      <!-- Action Button -->
      <button class="primary-action-btn" id="summarize-btn">
        <span class="bolt-icon">⚡</span>
        <span class="btn-caption" id="btn-text">Summarize Active Tab</span>
      </button>

      <!-- Error Notification -->
      <div class="error-banner hidden" id="error-box"></div>

      <!-- Loading State -->
      <div class="loading-panel hidden" id="loading-state">
        <div class="loading-spinner"></div>
        <div class="loading-text">
          <p class="loading-title">Synthesizing Executive Summary...</p>
          <p class="loading-subtitle" id="loading-step">Parsing content structure & arguments...</p>
        </div>
      </div>

      <!-- Summary Results Section -->
      <div class="results-panel hidden" id="result-container">
        <div class="results-top">
          <div class="results-meta">
            <span class="category-chip" id="result-category">Technology</span>
            <span class="time-read" id="result-time">~3 min read</span>
          </div>
          <button class="copy-pill-btn" id="copy-btn">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
            </svg>
            <span>Copy</span>
          </button>
        </div>

        <h3 class="result-heading" id="result-title"></h3>

        <!-- Section: Overview -->
        <div class="summary-section">
          <div class="section-badge">OVERVIEW</div>
          <p class="section-body" id="result-overview"></p>
        </div>

        <!-- Section: 5 Key Points -->
        <div class="summary-section">
          <div class="section-badge">5 KEY TAKEAWAY POINTS</div>
          <div class="keypoints-container" id="keypoints-list"></div>
        </div>

        <!-- Footer Link -->
        <div class="results-bottom">
          <a href="http://localhost:5173" target="_blank" class="web-hub-link">
            Open in BrieflyAI Web Dashboard ↗
          </a>
        </div>
      </div>
    </main>
  </div>

  <script src="popup.js"></script>
</body>
</html>
